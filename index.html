<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Visor Dron sin Fondo</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        #cesiumContainer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #333333; /* Fondo oscuro */
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <script>
        // 🚨 TOKEN DE ACCESO 🚨
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlMmNjMzRjNS03NTA4LTQwMGMtODZmOS0zZGViNGQwNzBiNTkiLCJpZCI6MzUxOTc1LCJpYXQiOjE3NjA4ODMyNTh9.PhM1Qc8BQLabwbrcT6aCgh_MmGVS7GCCUNXXXLByBeU'; 
        
        // 1. Inicializa el Visor Cesium
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: false, // Quita el mapa base
            terrain: false, // Quita el terreno virtual
            baseLayerPicker: false,
            animation: false,
            timeline: false,
            geocoder: false,
            sceneModePicker: false
        });

        // 2. Define la URL BASE de tu tileset
        const BASE_TILESET_URL = 'https://dron-visor-model-2025.s3.us-east-2.amazonaws.com/Model_0/';

        // 3. Carga el Tileset 3D (B3DM)
        const tileset = viewer.scene.primitives.add(
            new Cesium.Cesium3DTileset({
                url: BASE_TILESET_URL + 'tileset.json', 
                basePath: BASE_TILESET_URL, // Crucial para S3 y tilesets anidados
                skipLevelOfDetail: true, 
                cullWithChildrenBounds: false 
            })
        );
        
        // 4. Centra la cámara en el modelo cuando esté listo (SOLUCIÓN SEGURA)
        tileset.readyPromise
            .then(function(tileset) {
                // Opción más segura: vuela al modelo
                viewer.flyTo(tileset); 

                // OPCIONAL: Establecer un zoom máximo (menos propenso a errores que lookAtTransform)
                const boundingSphere = tileset.boundingSphere;
                viewer.scene.screenSpaceCameraController.maximumZoomDistance = boundingSphere.radius * 3;
                
            })
            .catch(function(error) {
                // Esto capturará cualquier error de carga (como el 404 de B3DM), no de la cámara
                console.error("Error al cargar el tileset:", error);
            });
    </script>
</body>
</html>
