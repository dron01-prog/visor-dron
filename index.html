<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Visor Dron con Búsqueda Manual</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        /* Estilos básicos para que el visor ocupe toda la página */
        #cesiumContainer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #333333; /* Fondo oscuro */
        }
        body {
            /* Asegura que no haya márgenes alrededor del visor */
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <script>
        // 🚨 TOKEN DE ACCESO 🚨
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlMmNjMzRjNS03NTA4LTQwMGMtODZmOS0zZGViNGQwNzBiNTkiLCJpZCI6MzUxOTc1LCJpYXQiOjE3NjA4ODMyNTh9.PhM1Qc8BQLabwbrcT6aCgh_MmGVS7GCCUNXXXLByBeU'; 
        
        // 1. Inicializa el Visor Cesium
        const viewer = new Cesium.Viewer('cesiumContainer', {
            // Ocultar elementos que tu cliente no necesita
            imageryProvider: false, // Desactivar mapa base
            terrain: false, // Desactivar terreno
            baseLayerPicker: false,
            animation: false,
            timeline: false,
            geocoder: false,
            sceneModePicker: false
        });

        // ** VISTA INICIAL PARA BÚSQUEDA MANUAL **
        // Centra la cámara en una posición amplia y genérica (Lat 10N, Lon 75W, Alt 10,000 km)
        viewer.camera.setView({
            destination : Cesium.Cartesian3.fromDegrees(-75.0, 10.0, 10000000.0) 
        });

        // 2. Define la URL BASE de tu tileset (S3)
        const BASE_TILESET_URL = 'https://dron-visor-model-2025.s3.us-east-2.amazonaws.com/Model_0/';

        // 3. Carga el Tileset 3D (B3DM)
        const tileset = viewer.scene.primitives.add(
            new Cesium.Cesium3DTileset({
                url: BASE_TILESET_URL + 'tileset.json', 
                basePath: BASE_TILESET_URL, // Crucial para resolver rutas internas
                skipLevelOfDetail: true, // Corrección de visualización
                cullWithChildrenBounds: false // Corrección de visualización
            })
        );
        
        // 4. Se ha eliminado el bloque tileset.readyPromise para evitar el TypeError.
        // Ahora, el modelo se cargará en el fondo, y el usuario deberá buscarlo manualmente.
    </script>
</body>
</html>
